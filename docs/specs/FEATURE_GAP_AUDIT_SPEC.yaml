domain: systematic_feature_gap_audit
contracts:
  - id: AUDIT-SYSTEMATIC-FEATURE-GAPS-01
    rule: Before further Ashide-derived feature implementation, Agentty maintains a source-grounded capability matrix covering domain models, user flows, interaction surfaces, persistence, failure semantics, local and remote parity, regression history, test evidence, and tracking accuracy.
  - id: AUDIT-REFERENCE-HISTORY-02
    rule: Every Ashide-derived capability audit reads the current specification, development tracker, regression tests, and relevant fix commits; rejected historical models and negative cases become explicit Agentty gaps or verified non-applicable decisions.
  - id: AUDIT-EVIDENCE-STATUS-03
    rule: A capability is complete only when current Agentty source and verification prove its full observable contract; partial shells, compile success, and adjacent tests cannot support verified status, and unsupported statuses must be downgraded.
  - id: AUDIT-PREIMPLEMENTATION-RED-04
    rule: Every actionable implementation gap is promoted through SPEC, tracker, matrix, and a fail-closed static check, then receives an observable-contract test that is run and recorded failing before implementation.
  - id: AUDIT-EIGHT-PRINCIPLES-GATE-05
    rule: Immediately before implementation, the engineer recites and checks all eight repository engineering principles; implementation remains blocked while any principle or required predecessor artifact is unsatisfied.
  - id: AUDIT-NATIVE-EDITOR-CAPABILITY-06
    rule: Agentty maintains a local and managed-SSH native editor capability matrix for open, edit, save, external-change watch, conflict handling, binary rejection, large-file rejection, reconnect, and mutation rollback. Every row names the canonical Host authority, failure semantics, source, and focused verification; a remote reconnect replaces stale watch ownership without discarding dirty buffers or falling back to local filesystem access.
  - id: AUDIT-ASHIDE-UI-REFERENCE-07
    rule: Ashide UI reference work records source-grounded decisions for session navigation, global search, tab hierarchy, terminal-editor balance, status presentation, and density. Each decision is classified as reuse, already present, deliberately not ported, or actionable gap, and visual similarity alone never justifies framework or editor-stack migration.
