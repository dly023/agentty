version: 4
updated: 2026-08-17
domain: environment_and_window_model
contracts:
  - id: ENV-WINDOW-BOUNDARY-01
    rule: Every application window is bound to exactly one managed execution Environment at a time. One Environment may own multiple application windows (peer windows via open_or_focus_environment), and each window may contain many repositories, tabs, panes, and Agent sessions. Explicit select_environment in an invoking window may rebind that window's EnvironmentId and WorkspaceId collection in place; this is the primary GUI path and does not open a peer window.
    migration: Primary GUI environment switching uses select_environment. open_or_focus_environment remains for CLI/headless entry and peer-window creation. WorkspaceId remains daemon collection identity and must not define the product model.
    forbidden:
      - retargeting_window_environment_without_explicit_select_or_open_or_focus
      - mixing_multiple_environment_authorities_in_one_content_column
      - mixing_local_and_remote_panes_in_one_content_column
  - id: ENV-EXECUTION-AUTHORITY-02
    rule: Environment is the canonical execution authority for process launch, filesystem, completion, sessions, Composer delivery, and activity events.
    kinds:
      - local
      - ssh
      - wsl
      - local_stdio
  - id: ENV-INHERITED-AUTHORITY-03
    rule: Every application window has exactly one EnvironmentId. Tabs and panes inherit the window EnvironmentId, and splits cannot silently introduce another authority.
    forbidden:
      - deriving_execution_host_from_incidental_application_focus
      - silently_mixing_local_and_remote_panes_in_one_window
  - id: ENV-INDICATOR-04
    rule: The Environment Indicator sits at the leading edge of the tab strip — the top-left of the content column, immediately right of the session sidebar — is always visible, and displays the window authority, connection health, and open-or-focus actions for other environments. The visible affordance is a health dot plus the environment short name; detailed state and non-secret remote endpoint context (user@host/IP and meaningful port) live in the tooltip and menu.
    display:
      - icon_and_short_name
      - local_or_remote_kind
      - connected_connecting_disconnected_error
      - remote_endpoint_detail_in_tooltip
    actions:
      - open_or_focus_environment_window
      - connect_or_reconnect
      - open_environment_management
    forbidden:
      - changing_the_current_window_authority_in_place
  - id: ENV-INDICATOR-LEAD-14
    rule: The Environment Indicator's horizontal lead inset derives from one pure mapping shared with other content-column title-bar headers (title_bar_content_lead). When the session sidebar is open, that lead is the shared panel_split_chrome_inset — the same authority used by right-panel leading chrome and other split-adjacent tiles (UI-PANEL-EDGE-GUTTER-08) — so left and right of the content column keep one distance to their splits. The macOS traffic-light lead applies only when the content-column title bar owns the traffic lights (sidebar collapsed). The content-column TitleBar shell itself must keep a zero leading pad (title_bar_shell_leading_pad) so gpui-component's default 80px traffic-light pad never stacks on top of title_bar_content_lead.
    forbidden:
      - traffic_light_lead_while_sidebar_owns_traffic_lights
      - per_callsite_divergent_title_bar_lead
      - environment_indicator_floating_far_from_sidebar_split
      - split_lead_divergent_from_panel_split_chrome_inset
      - title_bar_shell_padding_stacked_on_content_lead
  - id: ENV-INDICATOR-GLYPH-13
    rule: The Environment Indicator renders a persistent machine-kind glyph before the health dot and short name, so a local window and a remote server window are distinguishable at a glance without reading the label. The glyph derives from the same Environment authority as the label through one pure mapping, never from incidental focus or transport state, and connection health remains expressed by the dot and tooltip rather than by swapping the glyph.
    display:
      - local_machine_glyph_for_local_authority
      - remote_machine_glyph_for_remote_authority
      - health_dot_and_tooltip_unchanged
    forbidden:
      - text_only_environment_indicator
      - glyph_derived_from_focus_or_transport_instead_of_authority
      - hiding_the_health_dot_when_the_glyph_is_present
  - id: ENV-NAVIGATOR-SEPARATION-05
    rule: The left Agent Session Navigator lists sessions for the window Environment and does not replace the Environment Indicator.
  - id: ENV-PERSISTENCE-06
    rule: Persistence stores every Environment-bound application window by stable window/workspace identity without duplicating execution authority in unrelated view records. Multiple windows may reference the same EnvironmentId, while each keeps a distinct daemon workspace collection, geometry, tab tree, and last-active timestamp.
  - id: ENV-AUTHORITY-VISIBLE-07
    rule: Local and managed remote windows continuously identify their execution authority. Remote connection success also produces one explicit entered-remote-environment notification.
  - id: ENV-CONNECTION-TRANSITION-08
    rule: A managed remote Environment has explicit connecting, connected, disconnected, and error states. A transition into connected emits the entered notification exactly once per connection attempt.
  - id: ENV-DISCONNECT-FAIL-CLOSED-09
    rule: When a remote Environment disconnects, its window remains remote and input, process launch, filesystem, sessions, and completion must fail closed or request reconnect. It must never fall back to the local host.
  - id: ENV-OPENSSH-NATIVE-BOUNDARY-10
    rule: Running ssh inside a terminal remains an OpenSSH child process in that window and does not change Agentty Environment authority. Selecting an SSH Environment through Agentty uses the managed russh path and opens or focuses a dedicated Environment window.
  - id: ENV-OPEN-OR-FOCUS-11
    rule: The ordinary Open Environment action activates the most-recent open window for that EnvironmentId, or creates one when none is open. Explicit session-detach and New Peer Window actions may create another window bound to the same EnvironmentId; they never retarget a window from another Environment.
  - id: ENV-WINDOW-ACTIVATION-17
    rule: Every ordinary Environment-menu open-or-focus action uses the existing canonical `open_or_focus_environment` → `open_with_session` path. A fresh window is not considered opened until its WindowRegistry entry has been published and that exact native window handle has been activated; the activation/focus step occurs before the path returns to the menu action. The existing-window branch activates the exact same handle. WorkspaceStore claim and managed-remote supervision remain the existing lifecycle responsibilities, and a repeated intent for the same Environment returns the exact existing window without a duplicate registry entry or host supervisor.
    boundary: The invariant covers UI publication and native window activation only. It does not claim rollback of an already-started child process, SSH handshake, or daemon-side mutation; remote supervision remains responsible for eventual convergence.
    forbidden:
      - returning_before_new_window_activation
      - duplicate_environment_window_or_host_supervisor_on_repeat
      - activating_a_different_window_than_the_newly_registered_handle
  - id: ENV-WINDOW-MENU-16
    rule: When multiple environments are available, the tab/dock bar context menu exposes one quick open-or-focus item per environment. Selecting an item uses the canonical open_or_focus_environment_window path, never retargets the current window, and the resulting window title uses the environment display name.
    display:
      - environment_name
      - remote_endpoint_detail_when_available
    forbidden:
      - duplicate_environment_menu_items
      - retargeting_current_window_in_place
      - opening_a_window_without_environment_authority
  - id: ENV-WINDOW-DRAG-BOUNDARY-18
    rule: A primary-button tab drag is scoped to the active application window and its single Environment. Pointer movement across another application window or outside the strip never transfers, rebinds, or retargets a tab; the source window and Environment remain unchanged. Moving a tab to a new window is an explicit context-menu/command action that creates a peer bound to the same Environment and uses the canonical atomic tree transfer. The explicit action is not inferred from a drag leaving the window.
    forbidden:
      - cross_environment_pointer_drop
      - cross_window_pointer_transfer
      - drag_outside_strip_implicitly_detaching_a_tab
      - retargeting_the_source_window_environment
  - id: ENV-PROFILE-DISPLAY-LABEL-12
    rule: A saved SSH profile Environment keeps the profile UUID in EnvironmentId and routing, while every user-visible short label resolves from the current profile registry name. Renaming a profile updates presentation without changing EnvironmentId. A missing profile uses an explicit stable fallback and never exposes a raw UUID as the normal connected label.
    forbidden:
      - using_profile_name_as_environment_identity
      - rendering_raw_profile_uuid_when_the_profile_registry_entry_exists
  - id: ENV-SESSION-OPS-FACADE-15
    rule: Session Navigator discovery, store-root resolution, and related Host-backed session actions are addressed only to the window Environment through EnvironmentSessionContext (or equivalent). UI production call sites request Environment-scoped ops and must not branch on local vs remote transport, reconstruct remote roots from GUI HOME, or fall back to the local host for a remote Environment. Local vs remote transport and handshake roots live inside the facade and Host/AgentRuntimeAdapter implementations.
    forbidden:
      - ui_is_local_branch_for_session_discovery
      - gui_guessing_remote_provider_roots
      - remote_session_ops_falling_back_to_local_host
  - id: ENV-REMOTE-FACTS-19
    rule: For a managed remote Environment, the selected Host and its daemon are the sole authority for target-owned machine trees, pane facts and titles, provider stores, session user state, hooks, and target-side files. GUI-local files and mirrors may hold only explicitly named client state, cache, or pending intent. Hydration, reconnect, refresh, and source failure must never promote local data into remote facts or use local data as a remote-success fallback. Any local-to-remote write must use the canonical HostOps or ControlRequest path with workspace/pane/session identity and ownership preconditions; unknown, stale, rejected, or disconnected results fail closed.
    forbidden:
      - hydrate_promoting_local_projection_to_remote_fact
      - reconnect_using_local_same_name_data_as_remote_fallback
      - direct_gui_file_write_for_remote_authority
      - remote_write_without_identity_or_ownership_precondition
  - id: ENV-REMOTE-PEER-20
    rule: WorkspaceStore::claim_remote resolves a persisted peer for the requested Environment without losing the daemon workspace identity. It first selects a peer whose remote_workspace exactly equals RemoteRef.workspace; when no exact peer exists, it selects the latest open peer using the canonical (open, last_active) ordering; only when the Environment has no persisted peer does it allocate a new application workspace. Selection never retargets another Environment or overwrites a selected peer's remote_workspace.
    forbidden:
      - selecting_the_first_environment_record_without_matching_remote_workspace
      - allocating_duplicate_environment_windows_when_a_peer_can_be_reused
      - replacing_a_persisted_peer_remote_workspace_during_claim
  - id: ENV-REMOTE-HOOK-ROOTS-21
    rule: Agent hooks and Navigator user state are target-side files. A local Environment facade resolves one immutable AgentStoreRoots snapshot from the local target environment at construction. A remote Connected/HostLinks carries the exact target snapshot published in HelloOk.store_roots; hook state, install, uninstall, refresh, and session alias/pin/order persistence consume that snapshot and never consult GUI HOME/environment or re-derive defaults from the local machine. Additive root fields (XDG_CONFIG_HOME, AGENTTY_CONFIG_DIR, OPENCODE_CONFIG_DIR, and GROK_HOME) are resolved by the target daemon; fields absent from an older HelloOk derive defaults from the published target home only. Discovery, hooks, and user-state persistence therefore address the same target roots, including custom provider configuration directories.
    forbidden:
      - remote_hook_target_reading_gui_environment
      - remote_hook_target_rederiving_roots_from_local_home
      - custom_store_discovery_with_default_hook_install_path
      - hostlinks_dropping_hook_root_fields
      - remote_user_state_rederiving_home_config_path
      - mutable_or_callsite_specific_hook_root_resolution
      - wire_dialect_bump_for_additive_hello_root_fields
  - id: ENV-SINGLE-WINDOW-RAIL-47
    rule: One primary application window switches Environment authority through AgenttyApp::select_environment when the user picks an environment from the indicator menu or left-rail row. The content column saves the prior Environment session, rebinds WorkspaceId authority, and loads the target Environment tabs without opening a peer window. Before wipe, the departing Environment's committed SessionNavigator projection is stashed in EnvironmentNavigatorCache keyed by EnvironmentId; switching back restores that stash then refreshes when discovery is ready. Multi-window open_or_focus_environment remains for entry points that lack an invoking window (CLI, connect flow). The left-rail environment tree extends the same select_environment primitive.
    forbidden:
      - mixing_local_and_remote_panes_in_one_content_column
      - retargeting_environment_authority_without_explicit_selection
      - environment_menu_opening_peer_window_when_invoking_app_is_available
      - promoting_stashed_navigator_cache_as_remote_authority
  - id: ENV-PIN-48
    rule: Environment pin preference is stored as client UI state in Config.environment_rail.pinned, distinct from session pin Host state. Pinned environments render at the top of the left environment rail; unpinned remotes default collapsed until explicitly expanded.
  - id: ENV-RAIL-COLLAPSE-49
    rule: Left-rail environment sections support independent manual expand/collapse persisted in Config.environment_rail.collapse_overrides per EnvironmentId. Collapsed sections and non-current environment rows show a one-line summary of connection state plus live/total session counts from the current Navigator or EnvironmentNavigatorCache; the current environment session list hides while its section is collapsed.
  - id: ENV-RAIL-TREE-52
    rule: Expanded non-current Environment sections render indented session preview rows sourced only from EnvironmentNavigatorCache. Clicking a preview row routes through select_environment for that EnvironmentId and never resumes, focuses, or delivers into a session under a different content-column authority. Current-environment sessions continue to render exclusively through the canonical Session Navigator list below the rail headers and must not be duplicated as rail preview children.
    forbidden:
      - activating_cached_preview_without_select_environment
      - duplicating_current_environment_sessions_under_rail_header
      - treating_preview_rows_as_remote_authority
  - id: ENV-DISCONNECT-SURFACE-50
    rule: A managed remote Environment exposes explicit disconnect and reconnect actions on the Environment Indicator menu for the current window authority, plus a persistent disconnect strip below the title bar while Disconnected, Reconnecting, or Failed. Actions route through RemoteLinks disconnect and retry_now or connect_to_host; fail-closed remote authority is preserved and local rows never substitute. The strip remains visible until Connected or the environment is no longer remote-managed.
    forbidden:
      - reconnect_only_in_switcher_context_menu
      - disconnect_without_visible_current_environment_action
      - local_fallback_rows_on_remote_disconnect
  - id: ENV-EXPLICIT-CONNECT-51
    rule: Selecting or opening a remote Environment does not auto-start transport while the host is offline. RemoteLinks::defer_until_explicit_connect marks the host suspended until the user explicitly reconnects or connects from the environment menu, disconnect strip, or connect flow. Session Navigator discovery for a remote Environment waits until RemoteStatus is Attached; RemoteLinkUp remains the canonical post-connect discovery transition.
    forbidden:
      - auto_connect_on_remote_workspace_supervise
      - initial_target_discovery_while_remote_disconnected
      - pin_or_environment_select_implicit_connect
status: in_progress
