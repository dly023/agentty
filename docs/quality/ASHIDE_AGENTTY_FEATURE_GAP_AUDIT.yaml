status_vocabulary:
  present: Full tracked observable contract has current source and verification evidence.
  partial: A useful canonical core exists, but one or more tracked observable dimensions are absent.
  missing: No production path implements the tracked capability.
  non_applicable: Explicit Agentty product contract excludes the Ashide capability; rationale and negative guard remain required.
historical_models_rejected:
  - id: REJECT-ALIAS-SOURCE-ONLY
    model: Alias becomes effective only after a provider backing source is discovered.
    reason: Live sessions have no source-backed alias until provider persistence appears, causing a visible live-to-history discontinuity.
    required_negative_tests: [live_only_alias_is_immediately_visible, provider_source_appearance_preserves_explicit_alias]
  - id: REJECT-PROVIDER-AS-SESSION-NAME
    model: Agent or provider display name is an unnamed session's alias.
    reason: Provider identity and session identity are different product concepts; the provider label hides the user's first task context.
    required_negative_tests: [provider_identity_is_never_a_session_alias, first_user_message_names_untitled_session]
  - id: REJECT-ROW-LOCAL-USER-STATE
    model: Alias and pin live only on an in-memory NavigatorRow.
    reason: Refresh, restart, carrier replacement, remote authority changes, and deletion cannot share or roll back one canonical state.
    required_negative_tests: [alias_survives_restart_and_carrier_replacement, remote_alias_never_uses_local_state]
  - id: REJECT-STATUS-DOT-AS-STATE-SYSTEM
    model: A success or warning dot proves the complete Agent execution state system.
    reason: It omits typed event precedence, waiting-for-user semantics, stale events, completion/unread transitions, and focused/background presentation.
    required_negative_tests: [historical_rows_never_show_live_execution, stale_execution_event_cannot_replace_current_state]
  - id: REJECT-CONTEXT-MENU-AS-HOVER-DETAILS
    model: A right-click static dialog is equivalent to the hover detail sidecar.
    reason: It omits hover ownership, stable anchoring, safe pointer travel, stale-target cancellation, and immediate status-rich context.
    required_negative_tests: [hover_target_survives_carrier_replacement, stale_hover_target_closes_fail_closed]
  - id: REJECT-LOCAL-DELETE-CHANNEL
    model: Session deletion directly removes a local path outside the Environment Host abstraction.
    reason: It breaks local/remote authority parity and makes rollback semantics diverge.
    required_negative_tests: [remote_delete_never_touches_local_source, failed_source_delete_rolls_back_projection]
