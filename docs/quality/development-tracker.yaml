    evidence: 2026-08-16 inventory, runtime migration, focused authority test, and
      environment-window static gates prove WorkspaceId is retained only for daemon
      tree routing while EnvironmentId owns user-facing authority
    old_path_removal: WorkspaceId remains only for daemon collection, persistence
      routing, and tree synchronization; user-facing authority is EnvironmentId.
