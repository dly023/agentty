technical_debt:
- id: DEBT-BUNDLE-VERSION-STAMP
  title: Desktop bundle version metadata cannot distinguish builds
  owner: packaging
  status: verified
  removal_condition: The macOS bundle derives CFBundleVersion from the staged native
    server's exact revision+source fingerprint build stamp while retaining pinned
    user-facing SemVer.
  verification: The package cleanup gate rejects Git-only bundle identity and requires
    BUNDLE_VERSION to come from the staged native server --protocol build field.
  evidence: '2026-08-16 resolved: the bundle derives CFBundleVersion from the staged
    native server --protocol build identity, whose revision plus deterministic agentty-core/agentty-server
    source fingerprint distinguishes dirty server-source builds sharing one HEAD.
    The c9 GUI target and native/x86/aarch helpers all report 0.0.1+d9f6f89.c521e25d91ceb9dd;
    formal helper, bundle, and package-cleanup gates pass.'
