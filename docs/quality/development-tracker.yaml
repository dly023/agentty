      bypassed canonical quick presubmit and presubmit orphaned the quality contract
      suite.
    evidence: 2026-08-09 CI now invokes only the canonical quick presubmit plus the
      independent version-policy check; quick presubmit runs the quality contract
      suite. Focused infrastructure contracts and canonical quick presubmit passed.
  - id: DEBT-QUALITY-002
    title: Eliminate pipefail early-exit matcher nondeterminism repository-wide
    status: verified
