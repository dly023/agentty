      - 2026-08-09 acceptance rerun mapped each delivered slice to its public behavior: CLI wait passed the real CLI/server process E2E plus timeout=124, changed-edge, stale-agent/liveness, agentless-idle, and unrequested-exit tests; remote completion passed selected-Host and no-local-fallback tests; remote image paste passed SSH authority, owner-only staging, WSL path translation, TIFF conversion, and transfer-failure contracts
