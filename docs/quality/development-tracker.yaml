- id: M9-LOCAL-RUNTIME
  title: Reliable resource-leased local runtime
  status: verified
  outcome: Keep durable panes in a headless runtime while eliminating pane-only split-brain
    readiness, GUI-disguised daemon spawning, and undiagnosable detached failures
    before introducing idle resource leases.
  items:
  - id: LOCAL-RUNTIME-001
    title: Dual-endpoint readiness and recovery
    status: verified
    spec: LOCAL-RUNTIME-READINESS-01
    tests:
    - pane_endpoint_without_control_endpoint_is_degraded
    - server_lifecycle_uses_canonical_dual_endpoint_readiness
    evidence: 2026-08-03 pane-only runtime is degraded, GUI and CLI lifecycle entrypoints
      share daemon::spawn readiness, isolated CLI E2E made both endpoints ready and
      removed both on stop, and full presubmit passed.
  - id: LOCAL-RUNTIME-002
    title: Dedicated packaged local server executable
    status: verified
    spec: LOCAL-RUNTIME-EXECUTABLE-02
    tests:
    - daemon_executable_is_the_headless_sibling
    evidence: 2026-08-03 canonical spawn selects agentty-server, desktop bundle scripts
      require the native sibling, workspace default builds include agentty-server,
      and full presubmit passed.
  - id: LOCAL-RUNTIME-003
    title: Default bounded detached diagnostics
    status: verified
    spec: LOCAL-RUNTIME-DIAGNOSTICS-03
    tests:
    - server_logging_defaults_to_warnings
    evidence: 2026-08-03 server role defaults to warn/error logging, early startup
      exit names executable and log path, CLI log guidance matches the default, and
      full presubmit passed.
  - id: LOCAL-RUNTIME-004
    title: Lazy resource lease and Ask Keep Stop quit policy
    status: verified
    spec: LOCAL-RUNTIME-RESOURCE-LEASE-04
    tests:
    - gui_bootstrap_never_starts_the_local_runtime
    - passive_local_link_never_starts_the_local_runtime
    - zero_resource_runtime_exits_after_grace
    - live_pane_cancels_idle_shutdown
    - quit_policy_distinguishes_keep_and_stop
    evidence: 2026-08-03 GUI bootstrap and passive LocalLink no longer start the server;
      the default window immediately creates its first durable terminal pane, which
      is the lazy-start authority. Isolated live GUI smoke stayed healthy without
      warnings, forced GUI termination preserved the pane/runtime by design, explicit
      Stop removed control.sock, daemon.sock, and daemon.pid, deterministic zero-resource/Ask-Keep-Stop
      tests passed, and full presubmit passed.
  - id: LOCAL-RUNTIME-005
    title: Single-flight lifecycle and fatal control-listener startup
    status: verified
    spec: LOCAL-RUNTIME-START-SINGLEFLIGHT-05
    tests:
    - concurrent_lifecycle_callers_share_one_startup_gate
    - concurrent_server_start_callers_converge_on_one_runtime
    - control_listener_failure_is_fatal_before_pane_service
    red_test_evidence: 2026-08-03 focused core tests first failed with missing with_startup_gate
      and run_daemon_with. A 20-caller isolated live stress then reproduced 20/20
      startup failures caused by competing children, pid/control ownership races,
      and winner teardown; the concurrent_server_start_callers_converge_on_one_runtime
      E2E locks this regression.
    evidence: 2026-08-03 lifecycle mutation now holds one config-scoped OS file lock
      across GUI and CLI processes plus an in-process mutex; the server fails before
      pane service when control startup fails and removes endpoints it owned on listener-thread
      creation failure. Focused core tests and concurrent-start CLI E2E passed; an
      isolated 20-caller live stress improved from 20/20 failures to 0/20 and reported
      one dual-endpoint-ready runtime.
- id: M10-DEBT-RESET
  title: Pre-user architecture, quality, and performance debt reset
  status: verified
  outcome: Remove known parallel ownership, nondeterministic gates, broken build boundaries,
    dead paths, and measured hot-path costs before compatibility pressure exists.
  items:
  - id: DEBT-QUALITY-001
    title: Make quick presubmit the single CI/static-gate authority
    status: verified
