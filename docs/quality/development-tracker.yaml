        evidence: 2026-07-31 four agentty-core environment identity and classification tests passed
        old_path_removal: Remove host authority lookup through WindowView after persistence migration.
      - id: ENV-003
        title: Make windows the single Environment authority boundary
        status: verified
        spec: ENV-INHERITED-AUTHORITY-03
        tests:
          - window_environment_is_derived_from_its_persisted_authority
