policy:
  source_of_truth: docs/quality/development-tracker.yaml
  allowed_statuses:
  - planned
  - specified
  - in_progress
  - blocked
  - implemented
  - verified
  - removed
  required_flow:
  - spec
  - tracker
  - matrix
  - check
  - test
  - implementation
  - verify
  - delete_old_path
feedback_policy:
  purpose: Persist actionable user product, interaction, architecture, and quality
    feedback across attention and session switches.
  allowed_statuses:
  - captured
  - triaged
  - promoted
  - implemented
  - verified
  - declined
  - superseded
  required_fields:
  - id
  - summary
  - status
  - area
  - decision
  - next_action
  promotion_rule: Before implementation, promote the feedback into a stable spec contract,
    milestone item, traceability row, static check, and failing focused test as applicable.
  retention_rule: Never delete feedback silently; declined or superseded entries retain
    the reason and replacement ID when one exists.
