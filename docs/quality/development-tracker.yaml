    title: Pre-user architecture, quality, and performance debt reset
    status: in_progress
    outcome: Remove known parallel ownership, nondeterministic gates, broken build boundaries, dead paths, and measured hot-path costs before compatibility pressure exists.
    items:
      - id: DEBT-QUALITY-001
        title: Make quick presubmit the single CI/static-gate authority
        status: verified
        spec: QUALITY-CANONICAL-PRESUBMIT-CI-01
        source: [.github/workflows/ci.yml, script/presubmit, script/tests/quality_gate_contract.sh]
        tests: [quality_infrastructure_contract, quality_gate_contract]
        red_test_evidence: 2026-08-09 quality_infrastructure_contract failed because CI bypassed canonical quick presubmit and presubmit orphaned the quality contract suite.
        evidence: 2026-08-09 CI now invokes only the canonical quick presubmit plus the independent version-policy check; quick presubmit runs the quality contract suite. Focused infrastructure contracts and canonical quick presubmit passed.
      - id: DEBT-QUALITY-002
        title: Eliminate pipefail early-exit matcher nondeterminism repository-wide
        status: verified
        spec: QUALITY-DETERMINISTIC-SHELL-GATES-02
        source: [script/check_quality_gates, script/check_ui_visual_system, script/check_local_runtime, script/check_agent_harness]
        tests: [quality_infrastructure_contract]
        red_test_evidence: 2026-08-09 repository audit found 17 live producer pipelines ending in rg -q, grep -q, or head after the same class caused a real transient pre-push failure.
        evidence: 2026-08-09 all repository shell gates and GitHub helper scripts use fully consuming matchers; check_quality_gates fails closed on regressions. Focused contract, affected gates, and quick presubmit passed.
      - id: DEBT-NOTIFY-003
        title: Repair the macOS clickable notification compile boundary
        status: verified
        spec: NOTIFY-CLICK-REVEAL-01
        source: [Cargo.toml, src/terminal/remote.rs, script/check_desktop_notifications]
        tests: [notification_text_removes_unsafe_controls_and_clamps_unicode, saturated_click_backend_falls_back_to_plain_notification]
        red_test_evidence: 2026-08-09 cargo check/clippy --workspace --all-targets failed at remote.rs because production imports mac_notification_sys without declaring it as a direct macOS dependency.
        evidence: 2026-08-09 mac-notification-sys is now a direct target-specific dependency. cargo check --bin agentty-app --all-targets --locked and four notification focused tests passed; the static gate requires the direct boundary.
technical_debt:
  - id: DEBT-BUNDLE-VERSION-STAMP
    title: Desktop bundle version metadata cannot distinguish builds
    owner: packaging
    status: planned
    removal_condition: Version policy explicitly allows embedding build metadata (e.g. CFBundleVersion = 0.0.1+<date>.<githash>) or a real version bump.
    verification: Two consecutive local builds produce distinguishable CFBundleVersion values in dist/Agentty.app/Contents/Info.plist.
    evidence: 2026-08-03 the stale-target install trap was only detectable via binary content markers, because every bundle reports 0.0.1 (bump_mode: explicit_policy_change_only).
