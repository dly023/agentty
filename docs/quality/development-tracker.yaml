      - integration and packaging rerun passed the real agentty-cli isolated daemon suite, routed multi-process server tests, all eight slice static gates, package-cleanup gate, and `./script/presubmit full` with 954 agentty-core tests plus server process/conformance suites; live SSH replacement/open-link evidence remains recorded under FEEDBACK-20260809-005
