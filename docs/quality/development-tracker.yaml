- id: FEEDBACK-20260809-008
  summary: Agentty must discover Jcode user sessions without exposing the many subagent
    or multi-process internal session files; ashide previously solved this with a
    filtering mechanism that should be audited for its invariants.
  status: superseded
  priority: high
  area: jcode_session_discovery
  original_decision: Do not parse ~/.jcode/sessions as an Agentty provider contract.
    Jcode's canonical picker merges snapshot+journal metadata, excludes imported files
    and conversations with zero visible messages, hides is_debug rows without spending
    the ordinary-session quota, and identifies user roots with parent_id=None; the
    installed v0.73.0 binary does not expose the machine-readable `jcode session list
    --json` command that Ashide Stage A assumed. Require Jcode to publish a versioned
    machine list whose default rows satisfy parent_id=null, is_debug=false, visible_message_count>0
    and resumable=true. Agentty will invoke that target-owned API for local and remote
    discovery, filter non-resumable rows defensively, and preserve the last complete
    generation on command/schema/partial failure. Use the official MIT-licensed Jcode
    app icon as the asset source, adapted to Agentty's monochrome currentColor badge
    rather than inventing an unofficial mark.
  evidence:
  - 'user direction 2026-08-09: Jcode has many session files, most apparently subagent
    or multi-process artifacts, and ashide previously filtered them successfully'
  - 'reference repository: https://github.com/1jehuang/jcode'
  - 'current Jcode v0.73.0: `jcode session list --json --limit 5` fails because `session
    list` is not a public subcommand'
  - 'current native picker: snapshot+journal merge, visible-message filtering, separate
    debug quota, and default is_debug hiding are implemented in jcode-tui session_picker/loading.rs
    and filter.rs'
  - 'real local store audit: 192 snapshots, 86 marked is_debug and all current rows
    parent_id=null, proving parent_id alone does not remove worker noise'
  - 'Ashide history: 4762db1 designed a versioned public JSON list; v0.0.5 later removed
    Jcode because the public contract was unavailable and private-store/subagent adaptation
    was too fragile'
  - 'icon source: jcode assets/app-icons/Jcode.icns and iOS AppIcon.png, repository
    MIT License'
  - '2026-08-09 acceptance rerun: installed `jcode v0.73.0 (44ffa5528)` exposes only
    `session rename`; `jcode session list --json --limit 5` exits 2 with `unrecognized
    subcommand list`, so Agentty cannot exercise a stable end-user discovery integration
    path'
  - '2026-08-09 real-store negative acceptance: 189 session snapshots include 86 debug
    roots, 0 non-root parent rows, 3 non-debug zero-message rows, 5 imported JSON
    files, and 186 backups; therefore parent-only, filename-only, and non-debug-only
    filters each admit forbidden rows'
  - 'acceptance constraint: no Jcode provider was shipped, so there is intentionally
    no Agentty UI acceptance claim; the result is a fail-closed architecture decision
    pending an upstream versioned API'
  decision: Superseded by FEEDBACK-20260814-021 and SESSION-JCODE-STABLE-LIST-GATE-34,
    which define the documented Session JSON boundary, record why the current API
    cannot enumerate history, and reject undocumented private artifacts.
  next_action: None — retain the upstream API request as historical context; future
    fields require a versioned contract.
  superseded_by: FEEDBACK-20260814-021
  promoted_to:
    spec: SESSION-JCODE-STABLE-LIST-GATE-34
    traceability: SESSION-JCODE-STABLE-LIST-GATE-096
    milestone: M1-SESSION-NAVIGATOR/SESSION-034
