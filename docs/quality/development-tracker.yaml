  - id: FEEDBACK-20260809-009
    summary: Independently recheck the claimed fix for the transient pre-push Session Navigator visual gate failure rather than treating a successful rerun as a diagnosis.
    status: verified
    priority: high
    area: session_navigator_static_gate_reliability
    decision: The earlier Jcode commit did not modify tab_sidebar and therefore did not fix the visual gate. Repeated execution reproduced the failure with an unchanged source hash. Root cause was `rg -q` exiting on its first match inside pipelines while `set -o pipefail` observed the upstream awk/rg writer's SIGPIPE as failure. All piped predicates in check_session_navigator now use a consuming rg helper, and the script rejects future piped `rg -q` usage.
    evidence:
      - commit 308db7e changed provider/spec/tracker/matrix/check references but did not change src/ui/tab_sidebar.rs
      - unchanged tab_sidebar sha256 06f46a7b84d60d50d0ce478483acd0773c08c2b2f865abad15276f394a1230fc reproduced `session rows must paint from Surfaces.sidebar helpers`
      - after replacing 22 early-exit pipeline searches, 100 consecutive complete check_session_navigator runs passed with the same source hash
    next_action: None — keep the self-check that forbids piped rg -q and retain full pre-push verification.
  - id: FEEDBACK-20260809-008
    summary: Agentty must discover Jcode user sessions without exposing the many subagent or multi-process internal session files; ashide previously solved this with a filtering mechanism that should be audited for its invariants.
    status: promoted
    priority: high
    area: jcode_session_discovery
    decision: Do not parse ~/.jcode/sessions as an Agentty provider contract. Jcode's canonical picker merges snapshot+journal metadata, excludes imported files and conversations with zero visible messages, hides is_debug rows without spending the ordinary-session quota, and identifies user roots with parent_id=None; the installed v0.73.0 binary does not expose the machine-readable `jcode session list --json` command that Ashide Stage A assumed. Require Jcode to publish a versioned machine list whose default rows satisfy parent_id=null, is_debug=false, visible_message_count>0 and resumable=true. Agentty will invoke that target-owned API for local and remote discovery, filter non-resumable rows defensively, and preserve the last complete generation on command/schema/partial failure. Use the official MIT-licensed Jcode app icon as the asset source, adapted to Agentty's monochrome currentColor badge rather than inventing an unofficial mark.
    evidence:
      - user direction 2026-08-09: Jcode has many session files, most apparently subagent or multi-process artifacts, and ashide previously filtered them successfully
      - reference repository: https://github.com/1jehuang/jcode
      - current Jcode v0.73.0: `jcode session list --json --limit 5` fails because `session list` is not a public subcommand
      - current native picker: snapshot+journal merge, visible-message filtering, separate debug quota, and default is_debug hiding are implemented in jcode-tui session_picker/loading.rs and filter.rs
      - real local store audit: 192 snapshots, 86 marked is_debug and all current rows parent_id=null, proving parent_id alone does not remove worker noise
      - Ashide history: 4762db1 designed a versioned public JSON list; v0.0.5 later removed Jcode because the public contract was unavailable and private-store/subagent adaptation was too fragile
      - icon source: jcode assets/app-icons/Jcode.icns and iOS AppIcon.png, repository MIT License
      - 2026-08-09 acceptance rerun: installed `jcode v0.73.0 (44ffa5528)` exposes only `session rename`; `jcode session list --json --limit 5` exits 2 with `unrecognized subcommand list`, so Agentty cannot exercise a stable end-user discovery integration path
      - 2026-08-09 real-store negative acceptance: 189 session snapshots include 86 debug roots, 0 non-root parent rows, 3 non-debug zero-message rows, 5 imported JSON files, and 186 backups; therefore parent-only, filename-only, and non-debug-only filters each admit forbidden rows
      - acceptance constraint: no Jcode provider was shipped, so there is intentionally no Agentty UI acceptance claim; the result is a fail-closed architecture decision pending an upstream versioned API
    next_action: Upstream a versioned Jcode machine-readable native session list or equivalent stable SDK endpoint. The current Agentty fail-closed registry boundary is verified; after the API ships, replace this gate through a new spec/matrix row with local/remote command delivery and schema failure tests, never a private-store parser.
    promoted_to:
      spec: SESSION-JCODE-STABLE-LIST-GATE-34
      traceability: SESSION-JCODE-STABLE-LIST-GATE-096
      milestone: M1-SESSION-NAVIGATOR/SESSION-034
