  summary: Opening the local GUI unexpectedly leaves a local background server, and
    the product must make this lifecycle difference from Ashide explicit and intentional.
  status: verified
  priority: current
  area: local_daemon_lifecycle
  decision: 'Keep a headless session runtime because durable PTYs must not be owned
    by a fallible GUI, but make it resource-leased rather than GUI-leased: do not
    start it for an idle GUI, start lazily on the first durable pane, exit after a
    grace period when there are no panes, clients, or pending mutations, and make
    Quit with live panes an explicit Ask/Keep/Stop policy. Package and launch the
    headless agentty-server binary rather than disguising the GUI executable as --daemon.
    Local and remote share domain primitives, not necessarily identical process topology;
    local discovery and filesystem work may remain direct when durability does not
    require the daemon.'
