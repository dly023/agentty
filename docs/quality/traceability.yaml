  - stale_manual_completion_keeps_unbound_supervisor_alive
  verification: cargo test --bin agentty-app switcher_reports_supervised_in_flight_attempt_as_connecting
    --locked && cargo test --bin agentty-app switcher_does_not_start_parallel_connect_for_supervised_host
    --locked && cargo test --bin agentty-app stale_manual_completion --locked && cargo
    test --bin agentty-app remote_workspace::tests::stale_remote_connection_result_is_ignored
    --locked && ./script/check_remote_connection_entry && ./script/presubmit quick
  red_test_evidence: '2026-08-16 preimplementation red contract: retry_now leaves
    a bound MachineLink in Reconnecting while no HostLinks is published; the production
    switcher still projects Offline and the click path starts ConnectFlow. The same
    gate requires live pump observation to clear attempting before the reconnect guard
    and requires both manual/supervisor completion paths to carry one coordinator
    generation. A second race audit found stale manual completion could unconditionally
    remove a newer manual_targets lease and clear a newer ConnectFlow; the lease/flow
    cleanup must match the stale generation.'
  evidence: '2026-08-16 green: ManualAttemptLease carries the coordinator generation,
    supervisor takeover retags an existing lease, and stale finish_connect cleanup
    matches both lease and ConnectFlow generation. stale_manual_completion (2/2),
    the complete remote_workspace test module (26/26), both supervised switcher regressions
    (1/1 each), cargo fmt --check, check_remote_connection_entry, and presubmit quick
    passed. Installed c9 remote acceptance remains separate. The preimplementation
    red evidence is retained above.'
