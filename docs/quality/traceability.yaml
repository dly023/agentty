    is scrolled to display_offset() 10 and carries a cloned terminal Selection, then
    receives the 80→40 column geometry a right split applies. The current Term::resize
    path clears/rebases that state, so the focused assertion is expected to fail before
    implementation. App-level GPUI coverage was staged against the real run_command(SplitRight)
    path before its serial verification run.'
  evidence: '2026-08-16 green boundary implementation: cargo test --bin agentty-app
    command_d_split_geometry_preserves_existing_pane_viewport_and_selection --locked
    (1/1) and cargo test --bin agentty-app resize_echo_preserves_scrollback_viewport_and_selection
    --locked (1/1) passed; local TerminalView resize and echoed DaemonMsg::Size now
    share RemoteTerminal::resize_term_preserving_viewport, and check_split_viewport_preservation
    is green. 2026-08-16 app acceptance green: cargo test --bin agentty-app command_d_split_right_gpui_preserves_old_pane_viewport_selection_and_geometry
    --locked (1/1) passed through the real run_command(SplitRight)→split(Axis::Horizontal)
    path with an invalid LocalStdio sibling (no daemon), observing the Ready leaf,
    offset/selection, and normalized left/right geometry. Installed desktop acceptance
    remains pending.'
  acceptance:
    command_d_dispatch_route: src/ui/keymap.rs SplitRight secondary-d → src/ui/app.rs
      run_command SplitRight → split(Axis::Horizontal)
    app_split_dispatch_and_geometry: command_d_split_right_gpui_preserves_old_pane_viewport_selection_and_geometry
